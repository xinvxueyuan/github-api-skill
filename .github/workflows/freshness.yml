name: Freshness

on:
  schedule:
    - cron: '0 4 * * 1'   # weekly, Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  check:
    name: Verify GitHub API timeliness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Script always exits 0 (writes report regardless); drift is triaged in the issue step.
      - name: Run freshness check
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify_api.mjs || true
      - name: Commit freshness report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/last-verified.md docs/last-verified.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(freshness): update GitHub API last-verified report'
            git push
          else
            echo 'report unchanged; nothing to commit'
          fi
      - name: Open drift issue on failure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let p = { failures: 0 };
            try { p = JSON.parse(fs.readFileSync('docs/last-verified.json', 'utf8')); } catch {}
            if (!p.failures) { console.log('no drift detected'); return; }
            const { owner, repo } = context.repo;
            const wanted = 'GitHub API 时效性告警：检测到端点漂移';
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            if (open.data.some((i) => i.title === wanted)) { console.log('drift issue already open'); return; }
            const body = fs.readFileSync('docs/last-verified.md', 'utf8');
            await github.rest.issues.create({ owner, repo, title: wanted, body });
            console.log('opened drift issue');